services:
  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khu-backend-app
    restart: always
    ports:
      - "5000:5000" # Sesuaikan jika Anda menggunakan port lain
    environment:
      # Koneksi DB sekarang mengarah ke Supabase (diatur via Environment Variable di Coolify)
      DATABASE_URL: "${DATABASE_URL}"
      PORT: 5000
      # SEC-4: WAJIB diisi URL frontend produksi agar CORS mengizinkannya.
      # Bisa beberapa origin dipisah koma. Contoh: FRONTEND_URL=https://khu.example.com
      FRONTEND_URL: "${FRONTEND_URL:-}"
